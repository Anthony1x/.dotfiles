# Used by xdg-desktop-portal when XDG_CURRENT_DESKTOP=qtile (set in scripts/start-wayland.sh).
# Everything goes to the GTK portal like in your X11 portals.conf, except screen
# capture, which needs the wlroots portal.
[preferred]
default=gtk;
org.freedesktop.impl.portal.ScreenCast=wlr;
org.freedesktop.impl.portal.Screenshot=wlr;
