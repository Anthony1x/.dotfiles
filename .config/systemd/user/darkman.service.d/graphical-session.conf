# Hooks like wallpaper.sh talk to the compositor and need WAYLAND_DISPLAY, which
# niri only imports into the user manager when the session starts. Pulled in by
# niri.service (niri.service.wants, like waybar and dunst) instead of
# default.target, which starts darkman at login before that.
[Unit]
PartOf=graphical-session.target
After=graphical-session.target awww@wallpaper.service awww@backdrop.service
