version = 4
final_space = true

# THEME_MODE is exported before every prompt by a precmd hook in ~/.zshrc,
# from the mode file ~/.local/share/darkman/ohmyposh.sh writes.
[palettes]
  template = '{{ if eq .Env.THEME_MODE "dark" }}mocha{{ else }}latte{{ end }}'

  [palettes.list.latte]
    blue = '#1e66f5'
    lavender = '#7287FD'
    os = '#ACB0BE'
    pink = '#ea76cb'
    text = '#494D64'
    wight = '#FFFFFF'
    yellow = '#df8e1d'

  # Pastel backgrounds in Mocha, so text and icon are dark.
  [palettes.list.mocha]
    blue = '#89b4fa'
    lavender = '#b4befe'
    os = '#585b70'
    pink = '#f5c2e7'
    text = '#1e1e2e'
    wight = '#1e1e2e'
    yellow = '#f9e2af'

[transient_prompt]
  template = "\n❯ "
  foreground = '#ffffff'
  background = 'transparent'
  foreground_templates = ['{{if gt .Code 0}}red{{end}}', '{{if eq .Code 0}}magenta{{end}}']

[[blocks]]
  type = 'prompt'
  alignment = 'left'
  newline = true

  [[blocks.segments]]
    leading_diamond = ''
    template = '{{.Icon}} '
    foreground = 'p:wight'
    powerline_symbol = ''
    background = 'p:lavender'
    type = 'os'
    style = 'diamond'

  [[blocks.segments]]
    template = '{{ .UserName }}@{{ .HostName }}'
    foreground = 'p:text'
    powerline_symbol = ''
    background = 'p:lavender'
    type = 'session'
    style = 'diamond'

  [[blocks.segments]]
    template = ' {{ .Path }}'
    foreground = 'p:text'
    powerline_symbol = ''
    background = 'p:pink'
    type = 'path'
    style = 'powerline'

  [[blocks.segments]]
    template = ' {{ .HEAD }}'
    foreground = 'p:text'
    powerline_symbol = ''
    background = 'p:blue'
    type = 'git'
    style = 'powerline'

[[blocks]]
  type = 'prompt'
  alignment = 'right'

  [[blocks.segments]]
    leading_diamond = ''
    trailing_diamond = ''
    template = '{{ .FormattedMs }}'
    foreground = 'p:text'
    background = 'p:yellow'
    type = 'executiontime'
    style = 'diamond'

[[blocks]]
  type = 'prompt'
  alignment = 'left'

  [[blocks.segments]]
    template = "\n ❯"
    type = 'text'
    style = 'plain'
    foreground_templates = ['{{if gt .Code 0}}red{{end}}', '{{if eq .Code 0}}magenta{{end}}']
