# Catppuccin Mocha. Copied to dunstrc.d/99-colors.conf by ~/.local/share/darkman/dunst.sh.
# Colors have to be quoted, otherwise "#" starts a comment.
[global]
    frame_color = "#f5c2e7"

[urgency_low]
    background = "#1e1e2e"
    foreground = "#cdd6f4"

[urgency_normal]
    background = "#1e1e2e"
    foreground = "#cdd6f4"

[urgency_critical]
    background = "#1e1e2e"
    foreground = "#cdd6f4"
    frame_color = "#f38ba8"
