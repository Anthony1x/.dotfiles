# Colors have to be quoted, otherwise "#" starts a comment.
[global]
    frame_color = "#ea76cb"

[urgency_low]
    background = "#eff1f5"
    foreground = "#4c4f69"

[urgency_normal]
    background = "#eff1f5"
    foreground = "#4c4f69"

[urgency_critical]
    background = "#eff1f5"
    foreground = "#4c4f69"
    frame_color = "#d20f39"
