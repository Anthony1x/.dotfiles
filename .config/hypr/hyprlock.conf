# Ported from hyprlock defaults, styled with Catppuccin Mocha Mauve

general {
    immediate_render = false
    grace = 0
    no_fade_in = false
    ignore_empty_input = false
}

background {
    monitor =
    path = screenshot
    blur_passes = 2
    blur_size = 7
    noise = 0.01
    contrast = 0.9
    brightness = 0.8
    vibrancy = 0.2
    vibrancy_darkness = 0.0
}

input-field {
    monitor =
    size = 250, 50
    outline_thickness = 3
    dots_size = 0.2
    dots_spacing = 0.15
    dots_center = true

    outer_color = rgb(CBA6F7)
    inner_color = rgb(1E1E2E)
    font_color = rgb(CDD6F4)
    fade_on_empty = true
    fade_timeout = 1000
    placeholder_text = <i>Password...</i>
    hide_input = false

    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%a, %b %d - %H:%M")"
    color = rgb(CDD6F4)
    font_size = 64
    font_family = Maple Mono NF
    position = 0, -80
    halign = center
    valign = center
}

label.sub {
    monitor =
    text = $USER
    color = rgb(A6ADC8)
    font_size = 18
    font_family = Maple Mono NF
    position = 0, -120
    halign = center
    valign = center
}
